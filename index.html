<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="חניה" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- תצוגה מקדימה בוואטסאפ / טלגרם / פייסבוק -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bsaviran.github.io/deganya6-parking/" />
  <meta property="og:title" content="חניה דגניה 6" />
  <meta property="og:description" content="מי בחניון? עדכון בזמן אמת למשפחה" />
  <meta property="og:image" content="https://bsaviran.github.io/deganya6-parking/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="he_IL" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="description" content="מי בחניון? עדכון בזמן אמת למשפחה" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>חניה דגניה 6</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-status="loading">
  <div class="glow" aria-hidden="true"></div>

  <main class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo">P</div>
        <div>
          <div class="brand-title">דגניה 6</div>
          <div class="brand-sub">החניה של המשפחה</div>
        </div>
      </div>
      <button id="whoBtn" class="who" hidden></button>
    </header>

    <!-- כניסה ראשונה -->
    <section id="setup" class="panel setup" hidden>
      <h2>ברוכים הבאים 👋</h2>
      <p class="muted">פעם אחת בכל טלפון, ואז האפליקציה זוכרת.</p>
      <label class="field" id="codeField">
        <span>קוד משפחה</span>
        <input id="codeInput" type="password" inputmode="numeric" autocomplete="off" placeholder="הקלידו את הקוד" />
      </label>
      <p class="field-label">מי את/ה?</p>
      <div id="peoplePick" class="people"></div>
    </section>

    <!-- מסך ראשי -->
    <section id="main" hidden>
      <div class="panel hero">
        <div class="hero-head">
          <span id="pill" class="pill"><i></i><b id="pillText">טוען</b></span>
          <span id="updated" class="muted small"></span>
        </div>
        <h1 id="headline">טוען…</h1>
        <p id="noteView" class="note-view" hidden></p>

        <!-- איור החניה -->
        <div class="lot" aria-label="מצב החניה">
          <div class="lot-wall">קיר</div>
          <div id="slotIn" class="slot in"></div>
          <div id="slotOut" class="slot"></div>
          <div class="lot-street"></div>
        </div>
      </div>

      <h3 id="actionsTitle" class="section-title"></h3>
      <div id="actions" class="actions"></div>

      <label class="field note">
        <span>הערה (לא חובה)</span>
        <input id="noteInput" maxlength="80" placeholder="למשל: יוצא ב-8:00" />
      </label>

      <button id="resetBtn" class="link-btn" hidden>איפוס — לסמן שהחניון פנוי</button>

      <details class="panel history">
        <summary><span>היסטוריה</span><span class="chev">›</span></summary>
        <ol id="historyList" class="timeline"></ol>
        <button id="clearHistBtn" class="link-btn danger" hidden>🗑️ מחיקת כל ההיסטוריה</button>
      </details>
    </section>

    <p id="loading" class="loading" hidden>מתחבר…</p>
    <p id="error" class="error" hidden></p>
  </main>

  <!-- חלון שאלה -->
  <dialog id="dlg" class="dlg">
    <form method="dialog">
      <h3 id="dlgTitle"></h3>
      <p id="dlgText" class="muted"></p>
      <input id="dlgInput" maxlength="30" />
      <div class="dlg-btns">
        <button value="cancel" class="btn ghost" formnovalidate>ביטול</button>
        <button value="ok" id="dlgOk" class="btn solid">אישור</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
